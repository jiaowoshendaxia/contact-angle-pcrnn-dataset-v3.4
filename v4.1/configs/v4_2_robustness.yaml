project:
  model_version: ls-psrmoe-v4.2-robustness
  seed: 20260710
  output_data_dir: data/processed
  audit_file: data/processed/loo_nnls_audit_v4.csv
  output_dir: outputs/v4_2_model_strengthening

sample:
  primary_mode: probe_assisted
  minimum_unique_probes: 2
  feasible_fit_status: [interior_fit, boundary_fit]
  development_splits: [train, validation]
  confirmation_splits: [internal_test, legacy_external, prospective_open_external]

robustness:
  seeds: [7, 19, 42, 67, 99]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  liquid_residual_shrinkage: 5.0
  bootstrap_resamples: 10000
  final_prediction_file: results/predictions_v4_1.csv
  xgboost:
    n_estimators: 400
    max_depth: 3
    learning_rate: 0.03
    subsample: 0.85
    colsample_bytree: 0.85
    min_child_weight: 3
    reg_lambda: 2.0
