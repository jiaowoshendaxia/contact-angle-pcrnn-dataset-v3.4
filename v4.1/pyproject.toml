[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspgmoe"
version = "4.1.0.dev0"
description = "Leakage-safe physics-summary residual learning for contact-angle prediction"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "torch>=2.5",
  "xgboost>=2.1",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
analysis = ["optuna>=4.0", "shap>=0.46", "matplotlib>=3.9"]
test = ["pytest>=8.3", "pytest-cov>=6.0"]

[project.scripts]
lspgmoe = "lspgmoe.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
